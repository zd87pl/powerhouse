name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff mypy types-requests types-PyYAML
      - name: Lint Python code
        run: |
          ruff check services/ tests/
          ruff format --check services/ tests/
      - name: Type check
        run: |
          mypy services/autofix-daemon/main.py --ignore-missing-imports
          mypy services/observability-bridge/main.py --ignore-missing-imports
          mypy services/orchestrator/state.py --ignore-missing-imports
          mypy services/intent_engine/ --ignore-missing-imports
      - name: Validate shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck infra/bootstrap/bootstrap-clis.sh || true
          shellcheck infra/scripts/*.sh || true
      - name: Check for secrets
        run: |
          # Fail the build if anything shaped like a real credential is committed.
          if grep -rEn "sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16}" services/ infra/ dashboard/src/ landing/src/; then
            echo "Potential secret found — remove it and rotate the credential."
            exit 1
          fi
      - name: Check no .env committed
        run: |
          test ! -f .env
          test ! -f infra/bootstrap/.envrc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python3 -m pytest tests/ -v
